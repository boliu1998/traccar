name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        default: preview

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build docker archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: ./gradlew build
      - run: git checkout ${{ github.ref_name }}
        working-directory: ./traccar-web
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: traccar-web/package-lock.json
      - run: npm ci && npm run build
        working-directory: ./traccar-web
      - run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip
          ./package.sh ${{ github.event.inputs.version }} other
        working-directory: ./setup
      - uses: actions/upload-artifact@v7
        with:
          name: docker-archive
          path: setup/traccar-other-*.zip
          compression-level: 0
          retention-days: 1

  upload:
    name: Upload installers
    needs: build
    if: ${{ github.event.inputs.version == 'preview' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-archive
      - env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          sudo apt-get install -y s3cmd
          s3cmd --acl-public put traccar-*.zip s3://traccar/builds/ --host=nyc3.digitaloceanspaces.com --host-bucket=traccar --access_key="$S3_ACCESS_KEY" --secret_key="$S3_SECRET_KEY"

  release:
    name: Create release with docker archive
    needs: build
    if: ${{ github.event.inputs.version != 'preview' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: docker-archive
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: traccar-other-*.zip

  docker:
    name: Build and push ARM64 Alpine image
    needs: build
    if: ${{ github.event.inputs.version != 'preview' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: docker-archive
          path: docker
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          images: ghcr.io/boliu1998/traccar
          tags: |
            type=raw,value=v${{ github.event.inputs.version }}
            type=raw,value=release
          labels: |
            org.opencontainers.image.version=${{ github.event.inputs.version }}
      - uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile.alpine
          build-args: VERSION=${{ github.event.inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          push: true
