services:

  database:
    image: postgres:16-alpine
    container_name: traccar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${TRACCAR_DB_PASSWORD:?set TRACCAR_DB_PASSWORD}
    volumes:
      - /opt/traccar/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U traccar -d traccar" ]
      interval: 10s
      timeout: 5s
      retries: 10

  traccar:
    image: ${TRACCAR_IMAGE:-ghcr.io/boliu1998/traccar:release}
    container_name: traccar
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://database:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${TRACCAR_DB_PASSWORD:?set TRACCAR_DB_PASSWORD}
      PROTOCOLS_ENABLE: teltonika
      LOGGER_CONSOLE: "true"
    ports:
      - "${TAILSCALE_BIND_IP:?set TAILSCALE_BIND_IP}:8082:8082/tcp"
      - "0.0.0.0:5027:5027/tcp"
    volumes:
      - /opt/traccar/logs:/opt/traccar/logs
      - /opt/traccar/media:/opt/traccar/media
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8082/api/health" ]
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 5
