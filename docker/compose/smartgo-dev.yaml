services:

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${TRACCAR_DB_PASSWORD:?set TRACCAR_DB_PASSWORD}
    volumes:
      - /opt/traccar-dev/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U traccar -d traccar" ]
      interval: 10s
      timeout: 5s
      retries: 10

  traccar:
    image: ${TRACCAR_IMAGE:-ghcr.io/boliu1998/traccar:dev}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://database:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${TRACCAR_DB_PASSWORD:?set TRACCAR_DB_PASSWORD}
      PROTOCOLS_ENABLE: teltonika,smartcar
      SMARTCAR_MANAGEMENT_TOKEN: ${SMARTCAR_MANAGEMENT_TOKEN:?set SMARTCAR_MANAGEMENT_TOKEN}
      LOGGER_CONSOLE: "true"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8082/api/health" ]
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 5
    ports:
      - "18082:8082"
      - "15000-15500:5000-5500"
    volumes:
      - /opt/traccar-dev/logs:/opt/traccar/logs
      - /opt/traccar-dev/media:/opt/traccar/media

  autoheal:
    image: willfarrell/autoheal:latest
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 60
      AUTOHEAL_START_PERIOD: 3600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
